app = "dentaplus-admin"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_API_URL = "https://dentaplus-api.fly.dev/api/v1"
    NEXT_PUBLIC_STOREFRONT_URL = "https://dentaplus-web.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
